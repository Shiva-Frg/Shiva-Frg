name: Generate Snake Animation

on:
  # Rebuild twice a day so the snake follows your latest contributions
  schedule:
    - cron: "0 */12 * * *"
  # Allow running it manually from the Actions tab
  workflow_dispatch:
  # Rebuild on every push to main
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate snake from the contribution grid
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/ocean.gif?color_snake=#00b4d8&color_dots=#1b1f2a,#0a4f6e,#0084a8,#00b4d8,#90e0ef

      - name: Push the generated files to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
